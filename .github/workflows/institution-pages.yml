name: 기관별 상세 페이지 주간 갱신

# 매주 수집된 공고 이력(history.json)이 쌓이므로, 기관별 상세 페이지의
# 아카이브 목록과 수집 통계를 주 1회 다시 생성해 반영한다.
# (스크래퍼는 매시간 history.json을 갱신하고, 이 워크플로가 페이지에 반영)

on:
  schedule:
    - cron: '0 21 * * 0'   # 매주 월요일 06:00 KST (일 21:00 UTC)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 기관별 상세 페이지 재생성
        run: python3 build_institution_pages.py

      - name: 변경분 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # ⚠️ 스테이징할 파일을 나열하지 않는다 (scraper.yml 의 같은 주석 참고).
          #    기관이 추가되면 새 inst-*.html 이 생기고, 생성기가 쓰는 파일이
          #    늘어나면 목록이 어긋나 커밋이 누락되거나 rebase 가 깨진다.
          if [ -n "$(git status --porcelain)" ]; then
            git add -A
            git commit -m "기관별 상세 페이지 주간 갱신 (아카이브·통계) [skip ci]"
            git pull --rebase origin main
            git push
          else
            echo "변경 없음"
          fi
