name: Job Scraper Sync

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: scraper
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          playwright install --with-deps chromium

      - name: Run Scraper
        env:
          PYTHONIOENCODING: utf-8
        run: python scraper.py

      # 홈 본문은 React가 그리므로 HTML 소스에는 공고가 남지 않는다.
      # 수집 직후 정적 목록을 다시 만들어 크롤러가 읽을 본문을 유지한다.
      - name: 홈 정적 콘텐츠 재생성
        run: python3 build_static_home.py

      - name: Commit jobs.json / history.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # ⚠️ 스테이징할 파일을 하나하나 나열하지 않는다.
          #    빌드 스크립트가 파일을 하나 더 쓰기 시작하면 목록이 조용히 어긋나고,
          #    남은 변경분 때문에 아래 rebase 가 'cannot pull with rebase:
          #    You have unstaged changes' 로 죽는다. 실제로 두 번 그렇게 깨졌다.
          #      · history.json  — 스크래퍼가 누적 이력을 쓰기 시작했을 때
          #      · sitemap.xml   — build_static_home.py 가 lastmod 를 올리기 시작했을 때
          #    변경분을 통째로 스테이징하고, 산출물이 아닌 것은 .gitignore 로 막는다.
          if [ -n "$(git status --porcelain)" ]; then
            git add -A
            git commit -m "Update jobs data [skip ci]"
            git pull --rebase origin main
            git push
          else
            echo "No job changes"
          fi
